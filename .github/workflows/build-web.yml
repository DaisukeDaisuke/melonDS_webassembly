name: Build melonDS WebAssembly and Deploy Pages

on:
  push:
    paths:
      - 'melonDS_w'
      - 'melonDS_w/**'
      - 'web/**'
      - 'webassembly/**'
      - '.github/workflows/build-web.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get melonDS revision
        id: melonds-revision
        run: echo "sha=$(git -C melonDS_w rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cached melonDS WebAssembly output
        id: melonds-cache
        uses: actions/cache@v6
        with:
          path: web/dist/
          key: melonds-wasm-v2-${{ runner.os }}-${{ steps.melonds-revision.outputs.sha }}-${{ hashFiles('webassembly/**') }}

      - name: Install Emscripten
        if: steps.melonds-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Build melonDS WebAssembly
        if: steps.melonds-cache.outputs.cache-hit != 'true'
        run: |
          if ! test -f webassembly/vendor/desmume-source/Disassembler.cpp; then
            node webassembly/vendor-disassembler.mjs
          fi
          emcmake cmake -S webassembly -B webassembly/build -DCMAKE_BUILD_TYPE=Release
          cmake --build webassembly/build --target melonds -j 2

      - name: Verify melonDS WebAssembly output
        run: |
          test -s web/dist/melonds.js
          test -s web/dist/melonds.wasm

      - name: Build original isolated script workers
        run: |
          npm ci --prefix web/sandbox/upstream --ignore-scripts --no-audit --no-fund
          node web/scripts/build-workers.mjs

      - name: Restore cached DQ9 WFC dummy certificates
        id: dq9-certs-cache
        uses: actions/cache@v6
        with:
          path: web/dq9/certs/
          key: dq9-wfc-certs-v1

      - name: Generate same-origin DQ9 WFC dummy certificates
        if: steps.dq9-certs-cache.outputs.cache-hit != 'true'
        run: bash web/dq9/generate-certs.sh

      - name: Build Pages application
        run: node web/scripts/build-app.mjs

      - name: Check frontend
        run: node --test web/tests/*.test.js

      - name: Verify Pages output
        run: |
          test -s public/index.html
          test -s public/loader.js
          test -s public/main.js
          test -s public/melonds.wasm

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
